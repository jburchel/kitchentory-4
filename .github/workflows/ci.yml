name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kitchentory_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run API tests
      run: npm run --workspace=@kitchentory/api test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kitchentory_test
        NODE_ENV: test

    - name: Run mobile tests
      run: npm run --workspace=@kitchentory/mobile test

    - name: Build API
      run: npm run --workspace=@kitchentory/api build

    - name: Build mobile (dry run)
      run: npm run --workspace=@kitchentory/mobile start --dry-run || echo "Mobile build check completed"

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run security audit
      run: npm audit --audit-level moderate

    - name: Check for vulnerabilities
      run: npm audit --audit-level high || exit 0

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript type checking
      run: |
        npx tsc --noEmit --project apps/api/tsconfig.json
        npx tsc --noEmit --project apps/mobile/tsconfig.json